<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3F83BF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Nota">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <title>Nota</title>
  <style>
    :root {
      color-scheme: light;
      --accent: #3F83BF;
      --accent-dark: #040D40;
      --accent-light: color-mix(in srgb, var(--accent) 12%, white);
      --highlight: #F2A2CE;
      --highlight-dark: color-mix(in srgb, var(--highlight) 82%, black);
      --highlight-light: color-mix(in srgb, var(--highlight) 20%, white);
      --danger: #dc2626;
      --danger-light: #fef2f2;
      --bg: #F2F2F2;
      --card-bg: #ffffff;
      --text: #22181C;
      --text-muted: color-mix(in srgb, var(--text) 45%, white);
      --border: color-mix(in srgb, var(--text) 12%, white);
      --font: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 2.5rem 1.25rem 4rem;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      max-width: 520px;
      margin: 0 auto;
    }

    .brand {
      display: flex;
      justify-content: center;
      margin-bottom: 2rem;
    }

    .brand img {
      height: 56px;
      width: auto;
    }

    /* Login-scherm */
    #login-view {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.75rem 1.5rem;
    }

    #login-view h1 {
      font-size: 1.2rem;
      margin: 0 0 1.1rem;
      text-align: center;
    }

    #login-view label {
      display: block;
      font-size: 0.82rem;
      color: var(--text-muted);
      margin: 0 0 0.3rem;
    }

    #login-view input {
      width: 100%;
      font-family: inherit;
      font-size: 0.95rem;
      padding: 0.6rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 1rem;
    }

    #login-view input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-light);
    }

    #login-view button {
      width: 100%;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 0.65rem;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: white;
      cursor: pointer;
    }

    #login-view button:hover {
      background: var(--accent-dark);
    }

    #login-error {
      display: none;
      color: var(--danger);
      background: var(--danger-light);
      border-radius: 8px;
      padding: 0.6rem 0.75rem;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }

    /* Notities-scherm */
    #notes-view {
      display: none;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      gap: 0.6rem;
    }

    header .stats {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .header-actions {
      display: flex;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    #refresh-btn,
    #logout-btn {
      font-family: inherit;
      font-size: 0.85rem;
      color: var(--text-muted);
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.4rem 0.75rem;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
    }

    #refresh-btn {
      padding: 0.4rem 0.6rem;
    }

    #refresh-btn:hover,
    #logout-btn:hover {
      color: var(--text);
      border-color: var(--text-muted);
    }

    #refresh-btn.spinning svg {
      animation: spin 700ms linear;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Toolbar: zoeken/filteren/sorteren + export */
    .toolbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.6rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }

    .filters {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      align-items: center;
      flex: 1;
      min-width: 220px;
    }

    .filters input[type="text"],
    .filters select {
      font-family: inherit;
      font-size: 0.88rem;
      padding: 0.5rem 0.65rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card-bg);
      color: var(--text);
    }

    .filters input[type="text"] {
      flex: 1;
      min-width: 140px;
    }

    .filters input:focus,
    .filters select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-light);
    }

    /* Kebab-dropdownmenu's: max 1 tegelijk open, sluiten bij klik ernaast
       (via JS event delegation, werkt ook voor kaartjes die later dynamisch
       bijkomen na filteren/sorteren). */
    .menu {
      position: relative;
    }

    .menu > summary {
      list-style: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      color: var(--text-muted);
    }

    .menu > summary::-webkit-details-marker {
      display: none;
    }

    .menu > summary:hover {
      background: var(--bg);
      color: var(--text);
    }

    .menu[open] > summary {
      background: var(--accent-light);
      color: var(--accent);
    }

    .menu-list {
      position: absolute;
      right: 0;
      top: calc(100% + 6px);
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 10px 28px rgba(16, 24, 40, 0.14);
      padding: 0.4rem;
      min-width: 200px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
      animation: menu-in 120ms ease;
    }

    @keyframes menu-in {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      width: 100%;
      padding: 0.5rem 0.6rem;
      border-radius: 7px;
      font-family: inherit;
      font-size: 0.85rem;
      color: var(--text);
      background: none;
      border: none;
      text-decoration: none;
      cursor: pointer;
      text-align: left;
    }

    .menu-item svg {
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .menu-item:hover {
      background: var(--bg);
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      padding: 3rem 1rem;
      border: 1px dashed var(--border);
      border-radius: 14px;
    }

    .empty-icon {
      width: 48px;
      height: 48px;
      border-radius: 999px;
      background: var(--highlight-light);
      color: var(--highlight-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 0.8rem;
    }

    .note {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.1rem 1.25rem;
      margin-bottom: 1rem;
    }

    .note-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.6rem;
      flex-wrap: wrap;
      margin-bottom: 0.6rem;
    }

    .note-header-left {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .badge {
      --label-color: #7a726c;
      display: inline-block;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--label-color);
      background: color-mix(in srgb, var(--label-color) 12%, white);
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
    }

    .meta {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .player {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      margin: 0.7rem 0;
    }

    .play-btn {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      background: var(--accent);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .play-btn:hover { background: var(--accent-dark); }

    .icon-play {
      width: 0; height: 0;
      border-style: solid;
      border-width: 6px 0 6px 10px;
      border-color: transparent transparent transparent white;
      margin-left: 2px;
    }

    .icon-pause { display: none; position: relative; width: 10px; height: 12px; }
    .icon-pause::before, .icon-pause::after {
      content: ""; position: absolute; top: 0; width: 3px; height: 12px; background: white;
    }
    .icon-pause::before { left: 0; }
    .icon-pause::after { right: 0; }
    .player.playing .icon-play { display: none; }
    .player.playing .icon-pause { display: block; }

    .player-seek {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      cursor: pointer;
    }
    .player-seek::-webkit-slider-runnable-track {
      height: 4px; border-radius: 999px; background: var(--border);
    }
    .player-seek::-moz-range-track {
      height: 4px; border-radius: 999px; background: var(--border); border: none;
    }
    .player-seek::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 12px; height: 12px; margin-top: -4px;
      border-radius: 50%; background: var(--highlight); cursor: pointer;
    }
    .player-seek::-moz-range-thumb {
      width: 12px; height: 12px; border: none;
      border-radius: 50%; background: var(--highlight); cursor: pointer;
    }

    .player-time {
      font-size: 0.8rem;
      color: var(--text-muted);
      white-space: nowrap;
      min-width: 5.5em;
      text-align: right;
    }

    .note-title {
      font-size: 1.02rem;
      font-weight: 700;
      margin: 0.2rem 0 0.3rem;
      color: var(--text);
    }

    .note-summary {
      margin: 0 0 0.5rem;
      color: var(--text);
    }

    .action-items {
      list-style: none;
      margin: 0 0 0.6rem;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .action-items li {
      display: flex;
      align-items: flex-start;
      gap: 0.55rem;
      font-size: 0.9rem;
      color: var(--text);
    }

    .action-items li::before {
      content: "";
      flex-shrink: 0;
      width: 14px;
      height: 14px;
      margin-top: 0.15rem;
      border: 1.5px solid var(--accent);
      border-radius: 4px;
    }

    .transcription-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.03em;
      margin: 0.7rem 0 0.2rem;
    }

    .transcription {
      white-space: pre-wrap;
      margin: 0.4rem 0 0;
    }

    .transcription.clamp {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .transcription.clamp.expanded {
      display: block;
      -webkit-line-clamp: unset;
      overflow: visible;
    }

    .toggle-btn {
      display: none;
      margin-top: 0.35rem;
      font-family: inherit;
      font-size: 0.83rem;
      font-weight: 600;
      color: var(--accent);
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
    }

    .toggle-btn:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <noscript>
    <div class="wrap">
      <p style="color: #dc2626; text-align: center;">
        Deze pagina heeft JavaScript nodig om te werken. Zet JavaScript aan in je browserinstellingen en herlaad de pagina.
      </p>
    </div>
  </noscript>

  <div class="wrap">
    <div class="brand"><img src="logo.png" alt="Nota"></div>

    <div id="login-view">
      <h1>Log in om je notities te zien</h1>
      <div id="login-error"></div>
      <form id="login-form">
        <label for="email">E-mail</label>
        <input type="email" id="email" autocomplete="username" required>
        <label for="password">Wachtwoord</label>
        <input type="password" id="password" autocomplete="current-password" required>
        <button type="submit">Inloggen</button>
      </form>
    </div>

    <div id="notes-view">
      <header>
        <span class="stats" id="notes-count"></span>
        <div class="header-actions">
          <button id="refresh-btn" aria-label="Vernieuwen" title="Vernieuwen">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
          </button>
          <button id="logout-btn">Uitloggen</button>
        </div>
      </header>

      <div class="toolbar">
        <div class="filters">
          <input type="text" id="search-input" placeholder="Zoeken in transcriptie...">
          <select id="label-select">
            <option value="">Alle labels</option>
          </select>
          <select id="sort-select">
            <option value="newest">Nieuwste eerst</option>
            <option value="oldest">Oudste eerst</option>
            <option value="longest">Langste eerst</option>
            <option value="shortest">Kortste eerst</option>
          </select>
        </div>

        <details class="menu">
          <summary aria-label="Exportopties" title="Exporteren">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
          </summary>
          <div class="menu-list">
            <button type="button" class="menu-item" id="export-txt">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
              Exporteer overzicht (.txt)
            </button>
            <button type="button" class="menu-item" id="export-csv">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
              Exporteer overzicht (.csv)
            </button>
          </div>
        </details>
      </div>

      <div id="notes-list"></div>
    </div>
  </div>

  <!-- Vangnet: toont ELKE JS-fout zichtbaar op de pagina i.p.v. dat het
       inlogformulier stil "kapot" blijft zonder enige foutmelding. Staat
       bewust als allereerste script, zodat ook fouten uit de scripts
       hieronder (bv. het laden van supabase.min.js) hierdoor gevangen worden. -->
  <script>
    function showFatalError(message) {
      var el = document.getElementById("login-error");
      if (!el) return;
      el.textContent = "Er ging iets mis: " + message;
      el.style.display = "block";
    }
    window.addEventListener("error", function (e) {
      showFatalError(e.message + " (" + (e.filename || "onbekend bestand") + ":" + e.lineno + ")");
    });
    window.addEventListener("unhandledrejection", function (e) {
      showFatalError(String(e.reason));
    });
  </script>

  <!-- Zelf meegeleverd i.p.v. een externe CDN-link -- op sommige mobiele
       netwerken/browsers laadde die onbetrouwbaar, waardoor de hele pagina
       (incl. het inlogformulier) stil bleef hangen zonder foutmelding. -->
  <script src="supabase.min.js"></script>
  <script>
    if (!window.supabase) {
      showFatalError("De Supabase-bibliotheek kon niet laden. Ververs de pagina en probeer opnieuw.");
      throw new Error("window.supabase ontbreekt -- supabase.min.js niet geladen");
    }

    const SUPABASE_URL = "https://rqhrtiexwmgrlzgvrigm.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_GQKT1FiA-eudNrKfOY7jcQ_NMrWQQ8Y";
    // "sb" i.p.v. "supabase" als variabelenaam: de library zelf claimt de
    // naam "supabase" ook al als eigen globale variabele (niet alleen
    // window.supabase), dus const supabase = ... botste daarmee
    // ("Identifier 'supabase' has already been declared").
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Zelfde indeling als de kleurcodering op de hoofd-webinterface
    // (server/app.py -- LABEL_COLORS), zodat beide overal gelijk ogen.
    const LABEL_COLORS = {
      idee: "#3F83BF",
      werk: "#ea580c",
      persoonlijk: "#9333ea",
      notitie: "#16a34a",
    };
    const DEFAULT_LABEL_COLOR = "#7a726c";

    const loginView = document.getElementById("login-view");
    const notesView = document.getElementById("notes-view");
    const loginForm = document.getElementById("login-form");
    const loginError = document.getElementById("login-error");
    const notesList = document.getElementById("notes-list");
    const notesCount = document.getElementById("notes-count");
    const searchInput = document.getElementById("search-input");
    const labelSelect = document.getElementById("label-select");
    const sortSelect = document.getElementById("sort-select");

    let allNotes = [];

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str ?? "";
      return div.innerHTML;
    }

    function formatDisplayTime(value) {
      if (!value) return "onbekende tijd";
      const d = new Date(value);
      if (isNaN(d)) return value;
      return d.toLocaleString("nl-NL", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
    }

    function formatTime(sec) {
      if (!isFinite(sec)) return "0:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60).toString().padStart(2, "0");
      return `${m}:${s}`;
    }

    function formatTotalDuration(totalSeconds) {
      if (!totalSeconds) return null;
      if (totalSeconds < 60) return "<1 min";
      return `${Math.round(totalSeconds / 60)} min`;
    }

    function noteTxtHeader(note) {
      const displayTime = formatDisplayTime(note.note_timestamp || note.created_at);
      return `[${note.label || "geen label"}] ${displayTime} (${note.duration_sec || "?"}s)`;
    }

    function csvField(value) {
      return '"' + String(value ?? "").replace(/"/g, '""') + '"';
    }

    function downloadBlob(content, filename, mimeType) {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function getFilteredSortedNotes() {
      const query = searchInput.value.trim().toLowerCase();
      const label = labelSelect.value;
      const sort = sortSelect.value;

      let filtered = allNotes.filter((note) => {
        if (label && note.label !== label) return false;
        if (query && !(note.transcription || "").toLowerCase().includes(query)) return false;
        return true;
      });

      filtered.sort((a, b) => {
        if (sort === "oldest") return a.id - b.id;
        if (sort === "longest") return (b.duration_sec || 0) - (a.duration_sec || 0);
        if (sort === "shortest") return (a.duration_sec || 0) - (b.duration_sec || 0);
        return b.id - a.id; // newest (default)
      });

      return filtered;
    }

    function populateLabelSelect() {
      const labels = [...new Set(allNotes.map((n) => n.label).filter(Boolean))].sort();
      const current = labelSelect.value;
      labelSelect.innerHTML = '<option value="">Alle labels</option>' +
        labels.map((l) => `<option value="${escapeHtml(l)}">${escapeHtml(l)}</option>`).join("");
      labelSelect.value = current;
    }

    function render() {
      const notes = getFilteredSortedNotes();
      const totalDuration = formatTotalDuration(allNotes.reduce((sum, n) => sum + (n.duration_sec || 0), 0));
      notesCount.textContent = `${allNotes.length} notitie${allNotes.length !== 1 ? "s" : ""}` +
        (totalDuration ? ` · ${totalDuration} opgenomen` : "");

      if (notes.length === 0) {
        const isFiltered = searchInput.value.trim() || labelSelect.value;
        notesList.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
            </div>
            <p>${isFiltered ? "Geen notities gevonden voor deze zoekopdracht." : "Nog geen notities gesynced."}</p>
          </div>`;
        return;
      }

      notesList.innerHTML = "";
      for (const note of notes) {
        const labelColor = LABEL_COLORS[note.label] || DEFAULT_LABEL_COLOR;
        const card = document.createElement("div");
        card.className = "note";
        card.innerHTML = `
          <div class="note-header">
            <div class="note-header-left">
              <span class="badge" style="--label-color: ${labelColor};">${escapeHtml(note.label || "geen label")}</span>
              <span class="meta">${note.duration_sec || "?"}s · ${formatDisplayTime(note.note_timestamp || note.created_at)}</span>
            </div>
            <details class="menu">
              <summary aria-label="Meer opties" title="Meer opties">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
              </summary>
              <div class="menu-list">
                <a class="menu-item" href="${note.audioUrl || "#"}" download>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
                  Download audio
                </a>
                <button type="button" class="menu-item export-single-btn" data-id="${note.id}">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
                  Exporteer transcriptie
                </button>
              </div>
            </details>
          </div>
          ${note.title ? `<h3 class="note-title">${escapeHtml(note.title)}</h3>` : ""}
          ${note.summary ? `<p class="note-summary">${escapeHtml(note.summary)}</p>` : ""}
          ${note.actionItems && note.actionItems.length ? `
            <ul class="action-items">
              ${note.actionItems.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}
            </ul>` : ""}
          <div class="player">
            <audio class="player-audio" src="${note.audioUrl || ""}" preload="metadata"></audio>
            <button type="button" class="play-btn" aria-label="Afspelen">
              <span class="icon-play"></span>
              <span class="icon-pause"></span>
            </button>
            <input type="range" class="player-seek" value="0" min="0" max="0" step="0.1">
            <span class="player-time">0:00 / 0:00</span>
          </div>
          ${note.title ? '<p class="transcription-label">Transcriptie</p>' : ""}
          <p class="transcription clamp">${escapeHtml(note.transcription)}</p>
          <button type="button" class="toggle-btn">Toon meer</button>
        `;
        notesList.appendChild(card);
        wirePlayer(card);
        wireClamp(card);
      }
    }

    function wireClamp(card) {
      const p = card.querySelector(".transcription");
      const btn = card.querySelector(".toggle-btn");
      if (!p || !btn) return;
      if (p.scrollHeight > p.clientHeight + 1) {
        btn.style.display = "inline-block";
        btn.addEventListener("click", () => {
          const expanded = p.classList.toggle("expanded");
          btn.textContent = expanded ? "Toon minder" : "Toon meer";
        });
      }
    }

    async function showNotes() {
      loginView.style.display = "none";
      notesView.style.display = "block";
      notesList.innerHTML = '<p style="color: var(--text-muted);">Laden...</p>';

      const { data: notes, error } = await sb
        .from("notes")
        .select("*")
        .order("id", { ascending: false });

      if (error) {
        notesList.innerHTML = `<div class="empty-state"><p>Kon notities niet laden: ${escapeHtml(error.message)}</p></div>`;
        return;
      }

      // Signed URLs één keer vooraf ophalen en aan elke notitie plakken --
      // daarna kan filteren/sorteren/opnieuw tekenen puur client-side, zonder
      // steeds opnieuw bij Supabase te hoeven vragen.
      for (const note of notes) {
        const { data: signed } = await sb.storage.from("audio").createSignedUrl(note.audio_path, 3600);
        note.audioUrl = signed ? signed.signedUrl : null;
        try {
          note.actionItems = note.action_items ? JSON.parse(note.action_items) : [];
        } catch {
          note.actionItems = [];
        }
      }

      allNotes = notes;
      populateLabelSelect();
      render();
    }

    function wirePlayer(card) {
      const player = card.querySelector(".player");
      const audio = player.querySelector(".player-audio");
      const playBtn = player.querySelector(".play-btn");
      const seek = player.querySelector(".player-seek");
      const timeLabel = player.querySelector(".player-time");
      let seeking = false;

      audio.addEventListener("loadedmetadata", () => {
        seek.max = audio.duration;
        timeLabel.textContent = `${formatTime(0)} / ${formatTime(audio.duration)}`;
      });

      audio.addEventListener("timeupdate", () => {
        if (!seeking) seek.value = audio.currentTime;
        timeLabel.textContent = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
      });

      audio.addEventListener("ended", () => player.classList.remove("playing"));

      playBtn.addEventListener("click", () => {
        document.querySelectorAll("audio.player-audio").forEach((other) => {
          if (other !== audio && !other.paused) {
            other.pause();
            other.closest(".player").classList.remove("playing");
          }
        });
        if (audio.paused) {
          audio.play();
          player.classList.add("playing");
        } else {
          audio.pause();
          player.classList.remove("playing");
        }
      });

      seek.addEventListener("pointerdown", () => { seeking = true; });
      seek.addEventListener("pointerup", () => { seeking = false; });
      seek.addEventListener("input", () => { audio.currentTime = seek.value; });
    }

    // Kebab-menu's: max 1 tegelijk open, en sluiten bij een klik ernaast.
    // Via event delegation (niet per-element forEach) zodat dit ook werkt
    // voor notitiekaartjes die pas na filteren/sorteren worden bijgemaakt.
    document.addEventListener("toggle", (e) => {
      if (!e.target.matches || !e.target.matches("details.menu")) return;
      if (e.target.open) {
        document.querySelectorAll("details.menu[open]").forEach((other) => {
          if (other !== e.target) other.removeAttribute("open");
        });
      }
    }, true);

    document.addEventListener("click", (e) => {
      document.querySelectorAll("details.menu[open]").forEach((menu) => {
        if (!menu.contains(e.target)) menu.removeAttribute("open");
      });
    });

    // Exporteren per notitie (event delegation, zodat dit ook werkt voor
    // kaartjes die pas na filteren/sorteren worden bijgemaakt).
    notesList.addEventListener("click", (e) => {
      const exportBtn = e.target.closest(".export-single-btn");
      if (!exportBtn) return;
      const note = allNotes.find((n) => String(n.id) === exportBtn.dataset.id);
      if (note) downloadBlob(`${noteTxtHeader(note)}\n${note.transcription || ""}\n`, `nota-${note.id}.txt`, "text/plain");
    });

    // Exporteren: hele (gefilterde/gesorteerde) overzicht
    document.getElementById("export-txt").addEventListener("click", () => {
      const notes = getFilteredSortedNotes();
      const lines = [];
      for (const note of notes) {
        lines.push(noteTxtHeader(note));
        lines.push(note.transcription || "");
        lines.push("");
      }
      downloadBlob(lines.join("\n"), "nota-export.txt", "text/plain");
    });

    document.getElementById("export-csv").addEventListener("click", () => {
      const notes = getFilteredSortedNotes();
      const rows = [["label", "tijdstip", "duur_sec", "transcriptie"]];
      for (const note of notes) {
        rows.push([
          note.label || "",
          formatDisplayTime(note.note_timestamp || note.created_at),
          note.duration_sec || "",
          note.transcription || "",
        ]);
      }
      const csv = rows.map((row) => row.map(csvField).join(",")).join("\r\n");
      downloadBlob("﻿" + csv, "nota-export.csv", "text/csv");
    });

    searchInput.addEventListener("input", render);
    labelSelect.addEventListener("change", render);
    sortSelect.addEventListener("change", render);

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      loginError.style.display = "none";
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) {
        loginError.textContent = "Inloggen mislukt: " + error.message;
        loginError.style.display = "block";
        return;
      }
      showNotes();
    });

    document.getElementById("refresh-btn").addEventListener("click", async () => {
      const btn = document.getElementById("refresh-btn");
      btn.classList.add("spinning");
      btn.disabled = true;
      await showNotes();
      btn.classList.remove("spinning");
      btn.disabled = false;
    });

    document.getElementById("logout-btn").addEventListener("click", async () => {
      await sb.auth.signOut();
      notesView.style.display = "none";
      loginView.style.display = "block";
    });

    // Automatisch inloggen als er al een geldige sessie is (blijft staan
    // tussen bezoeken, zodat je 'm niet elke keer opnieuw hoeft in te loggen).
    sb.auth.getSession().then(({ data: { session } }) => {
      if (session) showNotes();
    });
  </script>
</body>
</html>
