  <title>Nota</title>
  <script>
    // Thema zo vroeg mogelijk zetten, zodat er geen witte flits is bij
    // donkere modus. "auto" volgt de telefoon-instelling.
    (function () {
      var pref = "auto";
      try { pref = localStorage.getItem("nota-theme") || "auto"; } catch (e) {}
      if (pref !== "auto") document.documentElement.setAttribute("data-theme", pref);
      // iOS kiest de kleur van de statusbalk bij het laden. Kies je in de
      // app een ander thema dan je telefoon, dan moet de kleur hier al
      // goed staan, anders blijft de balk wit (of zwart) tot je herstart.
      if (pref !== "auto") {
        var color = pref === "dark" ? "#101215" : "#F5F6F7";
        var metas = document.querySelectorAll('meta[name="theme-color"]');
        for (var i = 0; i < metas.length; i++) metas[i].parentNode.removeChild(metas[i]);
        var m = document.createElement("meta");
        m.name = "theme-color";
        m.content = color;
        document.head.appendChild(m);
      }
    })();
  </script>

  <!-- ===== Inloggen ===== -->
  <main id="login-view" style="display:none">
    <div class="login-inner">
      <img class="login-logo" src="logo.png" alt="Nota">
      <h1>Je notities en taken, waar je ook bent.</h1>
      <p class="lead">Log in om je opnames, samenvattingen en taken te zien.</p>
      <div id="login-error" role="alert"></div>
      <form id="login-form">
        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" autocomplete="username" inputmode="email" required>
        </div>
        <div class="field">
          <label for="password">Wachtwoord</label>
          <input type="password" id="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-primary" id="login-btn">Inloggen</button>
      </form>
      <button type="button" class="forgot" id="forgot-btn">Wachtwoord vergeten?</button>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- Vangnet: toont ELKE JS-fout zichtbaar i.p.v. dat de pagina stil
       "kapot" blijft. Staat bewust als eerste script, zodat ook een
       mislukte supabase.min.js of een module die niet laadt hierdoor
       gevangen wordt. -->
  <script>
    function showFatalError(message) {
      var el = document.getElementById("login-error");
      var toast = document.getElementById("toast");
      var appVisible = document.getElementById("app").style.display === "block";
      if (appVisible && toast) {
        toast.textContent = "Er ging iets mis: " + message;
        toast.classList.add("show");
        setTimeout(function () { toast.classList.remove("show"); }, 5000);
        return;
      }
      if (!el) return;
      document.getElementById("login-view").style.display = "";
      el.textContent = "Er ging iets mis: " + message;
      el.style.display = "block";
    }
    window.addEventListener("error", function (e) {
      // Fouten van externe stylesheets/lettertypes negeren we.
      if (!e.message) return;
      showFatalError(e.message + " (" + (e.filename || "onbekend bestand") + ":" + e.lineno + ")");
    });
    window.addEventListener("unhandledrejection", function (e) {
      showFatalError(String(e.reason && e.reason.message || e.reason));
    });
  </script>

  <script>
    // Oude browsers zonder ES-modules: laat een duidelijke melding zien.
    if (!("noModule" in HTMLScriptElement.prototype)) {
      showFatalError("Deze browser is te oud voor Nota. Werk hem bij en probeer opnieuw.");
    }
    // Laadt js/app.js niet (netwerk, cache)? Dan na een tijdje een melding.
    setTimeout(function () {
      if (!window.__notaBooted) showFatalError("De app kon niet starten. Ververs de pagina en probeer opnieuw.");
    }, 8000);
  </script>
</body>
</html>
